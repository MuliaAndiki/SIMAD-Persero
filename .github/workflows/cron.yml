name: SIMAD Cron Automation

on:
  schedule:
    # 07:15 WIB (Asia/Jakarta) is 00:15 UTC (Menghindari delay antrean panjang di jam 00:00 GitHub Actions)
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  scheduled-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
    steps:
      - name: Verify secrets are configured
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not set in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$INTERNAL_API_SECRET" ]; then
            echo "::error::INTERNAL_API_SECRET is not set in GitHub Secrets!"
            exit 1
          fi

      - name: Normalize API_BASE_URL
        run: |
          # Menghapus trailing slash dan /api/v1 jika ada agar URL valid, lalu memastikan format akhir adalah root URL
          NORMALIZED_URL=$(echo "$API_BASE_URL" | sed -e 's|/$||' -e 's|/api/v1$||')
          echo "NORMALIZED_URL=$NORMALIZED_URL" >> $GITHUB_ENV

      - name: Wake up Render service
        run: |
          echo "Waking up SIMAD API at ${NORMALIZED_URL}/api/v1/cron/warmup..."
          curl \
            --fail-with-body \
            --show-error \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-internal-api-key: $INTERNAL_API_SECRET" \
            "${NORMALIZED_URL}/api/v1/cron/warmup"

      - name: Wait before database warm-up
        run: |
          echo "Waiting 3 minutes before database warm-up..."
          sleep 180

      - name: Warm up database
        run: |
          echo "Warming up database at ${NORMALIZED_URL}/api/v1/cron/ping..."
          curl \
            --fail-with-body \
            --show-error \
            --retry 4 \
            --retry-delay 15 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-internal-api-key: $INTERNAL_API_SECRET" \
            "${NORMALIZED_URL}/api/v1/cron/ping"

      - name: Wait before internship automation
        run: |
          echo "Waiting 3 minutes before internship automation..."
          sleep 180

      - name: Run internship auto-start
        run: |
          echo "Running internship auto-start at ${NORMALIZED_URL}/api/v1/cron/internship..."
          curl \
            --fail-with-body \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-internal-api-key: $INTERNAL_API_SECRET" \
            "${NORMALIZED_URL}/api/v1/cron/internship"
